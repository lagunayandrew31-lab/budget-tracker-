publish_to: "none"
version: 1.0.0+1
environment:
  sdk: ">=3.3.0 <4.0.0"
dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  sqflite: ^2.4.1
  path: ^1.9.1
  shared_preferences: ^2.3.5
  flutter_riverpod: ^2.6.1
  fl_chart: ^0.70.2
  flutter_local_notifications: ^18.0.1
  timezone: ^0.10.0
  local_auth: ^2.3.0
  intl: ^0.20.2
  csv: ^6.0.0
